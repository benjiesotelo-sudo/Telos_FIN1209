<circle cx="60" cy="150" r="18" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="60" y="184" text-anchor="middle" font-size="11.5">Run the script</text>
<rect x="125" y="115" width="130" height="70" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="190" y="147" text-anchor="middle" font-size="11.5">1. List the CSV files</text>
<text x="190" y="161" text-anchor="middle" font-size="11.5">in the data folder</text>
<polygon points="330,125 355,150 330,175 305,150" fill="#fff" stroke="#222" stroke-width="1.8"/>
<path d="M322,142 L338,158 M338,142 L322,158" stroke="#222" stroke-width="2.4"/>
<text x="306" y="107" text-anchor="end" font-size="11.5">Another</text>
<text x="306" y="121" text-anchor="end" font-size="11.5">file left?</text>
<rect x="405" y="115" width="130" height="70" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="470" y="147" text-anchor="middle" font-size="11.5">2. Read the file and</text>
<text x="470" y="161" text-anchor="middle" font-size="11.5">clean its dates</text>
<rect x="555" y="115" width="130" height="70" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="620" y="147" text-anchor="middle" font-size="11.5">3. Work out the RSI,</text>
<text x="620" y="161" text-anchor="middle" font-size="11.5">MACD and stochastic</text>
<rect x="705" y="115" width="130" height="70" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="770" y="147" text-anchor="middle" font-size="11.5">4. Find each</text>
<text x="770" y="161" text-anchor="middle" font-size="11.5">oscillator&#x27;s crossings</text>
<rect x="855" y="115" width="130" height="70" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="920" y="147" text-anchor="middle" font-size="11.5">5. Add the votes, keep</text>
<text x="920" y="161" text-anchor="middle" font-size="11.5">the signal days</text>
<rect x="855" y="265" width="130" height="70" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="920" y="297" text-anchor="middle" font-size="11.5">6. Draw the chart with</text>
<text x="920" y="311" text-anchor="middle" font-size="11.5">the signals marked</text>
<rect x="705" y="265" width="130" height="70" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="770" y="297" text-anchor="middle" font-size="11.5">7. Add its signals</text>
<text x="770" y="311" text-anchor="middle" font-size="11.5">to the full list</text>
<rect x="405" y="25" width="130" height="70" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="470" y="57" text-anchor="middle" font-size="11.5">8. Write</text>
<text x="470" y="71" text-anchor="middle" font-size="11.5">output/signals.csv</text>
<circle cx="620" cy="60" r="18" fill="#fff" stroke="#222" stroke-width="4.5"/>
<text x="620" y="94" text-anchor="middle" font-size="11.5">Signals and</text>
<text x="620" y="108" text-anchor="middle" font-size="11.5">charts ready</text>
