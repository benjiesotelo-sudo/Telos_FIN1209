<polygon points="960,335 985,360 960,385 935,360" fill="#fff" stroke="#222" stroke-width="1.8"/>
<path d="M952,352 L968,368 M968,352 L952,368" stroke="#222" stroke-width="2.4"/>
<text x="960" y="313" text-anchor="middle" font-size="11.5">Gap up and back</text>
<text x="960" y="327" text-anchor="middle" font-size="11.5">to previous high?</text>
<polygon points="1130,335 1155,360 1130,385 1105,360" fill="#fff" stroke="#222" stroke-width="1.8"/>
<path d="M1122,352 L1138,368 M1138,352 L1122,368" stroke="#222" stroke-width="2.4"/>
<text x="1130" y="313" text-anchor="middle" font-size="11.5">Gap down and back</text>
<text x="1130" y="327" text-anchor="middle" font-size="11.5">to previous low?</text>
<rect x="895" y="435" width="130" height="70" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="960" y="460" text-anchor="middle" font-size="11.5">5. Record a SELL signal</text>
<text x="960" y="474" text-anchor="middle" font-size="11.5">entry = previous high</text>
<text x="960" y="488" text-anchor="middle" font-size="11.5">stoploss = new high</text>
<rect x="1065" y="435" width="130" height="70" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="1130" y="460" text-anchor="middle" font-size="11.5">6. Record a BUY signal</text>
<text x="1130" y="474" text-anchor="middle" font-size="11.5">entry = previous low</text>
<text x="1130" y="488" text-anchor="middle" font-size="11.5">stoploss = new low</text>
<rect x="575" y="325" width="130" height="70" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="640" y="357" text-anchor="middle" font-size="11.5">7. Draw the chart</text>
<text x="640" y="371" text-anchor="middle" font-size="11.5">and mark the signals</text>
<rect x="425" y="325" width="130" height="70" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="490" y="357" text-anchor="middle" font-size="11.5">8. Add this file&#x27;s</text>
<text x="490" y="371" text-anchor="middle" font-size="11.5">signals to the list</text>
<rect x="575" y="25" width="130" height="70" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="640" y="57" text-anchor="middle" font-size="11.5">9. Write</text>
<text x="640" y="71" text-anchor="middle" font-size="11.5">output/signals.csv</text>
