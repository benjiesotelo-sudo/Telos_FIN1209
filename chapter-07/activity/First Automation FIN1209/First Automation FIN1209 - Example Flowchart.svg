<circle cx="140" cy="80" r="18" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="166" y="84" text-anchor="start" font-size="11.5">Run the script</text>
<rect x="75" y="138" width="130" height="64" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="140" y="160" text-anchor="middle" font-size="12">1. List the CSV</text>
<text x="140" y="174" text-anchor="middle" font-size="12">files in the</text>
<text x="140" y="188" text-anchor="middle" font-size="12">data folder</text>
<rect x="75" y="268" width="130" height="64" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="140" y="297" text-anchor="middle" font-size="12">2. Read each file</text>
<text x="140" y="311" text-anchor="middle" font-size="12">and clean its dates</text>
<path d="M122,415 L148,415 L158,425 L158,465 L122,465 Z" fill="#fff" stroke="#222" stroke-width="1.5"/>
<path d="M148,415 L148,425 L158,425" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="164" y="444" text-anchor="start" font-size="11.5" font-weight="bold">data/&lt;ticker&gt;.csv</text>
<path d="M34,528 L20,528 L20,652 L34,652" fill="none" stroke="#555" stroke-width="1.4"/>
<text x="28" y="543" font-size="11" fill="#222">Input: one CSV file per stock,</text>
<text x="28" y="556.5" font-size="11" fill="#222">about a year of daily rows.</text>
<text x="28" y="570" font-size="11" fill="#222">Date (a date)</text>
<text x="28" y="583.5" font-size="11" fill="#222">Open, High, Low, Close (prices,</text>
<text x="28" y="597" font-size="11" fill="#222">numbers)</text>
<text x="28" y="610.5" font-size="11" fill="#222">Volume (a whole number)</text>
<path d="M299,90 L285,90 L285,190 L299,190" fill="none" stroke="#555" stroke-width="1.4"/>
<text x="293" y="105" font-size="11" fill="#222">Price trend (Chapter 5)</text>
<text x="293" y="118.5" font-size="11" fill="#222">Close above its 3 bar average</text>
<text x="293" y="132" font-size="11" fill="#222">of closes: up, else down</text>
<text x="293" y="145.5" font-size="11" fill="#222">(slides 109, 110)</text>
<rect x="545" y="108" width="130" height="64" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="610" y="137" text-anchor="middle" font-size="12">3. Vote 1: price trend</text>
<text x="610" y="151" text-anchor="middle" font-size="12">up or down</text>
<path d="M299,244 L285,244 L285,356 L299,356" fill="none" stroke="#555" stroke-width="1.4"/>
<text x="293" y="259" font-size="11" fill="#222">Price bar (Chapter 7)</text>
<text x="293" y="272.5" font-size="11" fill="#222">BUY: new low, close at or</text>
<text x="293" y="286" font-size="11" fill="#222">above the previous close</text>
<text x="293" y="299.5" font-size="11" fill="#222">SELL: new high, close at or</text>
<text x="293" y="313" font-size="11" fill="#222">below it (slides 123, 126)</text>
<rect x="545" y="268" width="130" height="64" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="610" y="297" text-anchor="middle" font-size="12">4. Vote 2: price bar</text>
<text x="610" y="311" text-anchor="middle" font-size="12">(key reversal)</text>
<path d="M299,420 L285,420 L285,520 L299,520" fill="none" stroke="#555" stroke-width="1.4"/>
<text x="293" y="435" font-size="11" fill="#222">RSI, 14 days (slide 195)</text>
<text x="293" y="448.5" font-size="11" fill="#222">BUY: crosses above 50</text>
<text x="293" y="462" font-size="11" fill="#222">SELL: crosses below 50</text>
<text x="293" y="475.5" font-size="11" fill="#222">(slide 74)</text>
<rect x="545" y="438" width="130" height="64" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="610" y="467" text-anchor="middle" font-size="12">5. Vote 3: RSI</text>
<text x="610" y="481" text-anchor="middle" font-size="12">crossing 50</text>
<path d="M299,578 L285,578 L285,702 L299,702" fill="none" stroke="#555" stroke-width="1.4"/>
<text x="293" y="593" font-size="11" fill="#222">MACD 12, 26, signal line 9</text>
<text x="293" y="606.5" font-size="11" fill="#222">(slides 166 to 168)</text>
<text x="293" y="620" font-size="11" fill="#222">BUY: MACD crosses above</text>
<text x="293" y="633.5" font-size="11" fill="#222">its signal line</text>
<text x="293" y="647" font-size="11" fill="#222">SELL: crosses below it</text>
<text x="293" y="660.5" font-size="11" fill="#222">(slide 83)</text>
<rect x="545" y="608" width="130" height="64" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="610" y="637" text-anchor="middle" font-size="12">6. Vote 4: MACD</text>
<text x="610" y="651" text-anchor="middle" font-size="12">crossing its signal</text>
<path d="M299,754 L285,754 L285,866 L299,866" fill="none" stroke="#555" stroke-width="1.4"/>
<text x="293" y="769" font-size="11" fill="#222">Stochastic: %K 14 days,</text>
<text x="293" y="782.5" font-size="11" fill="#222">%D = 3 day average</text>
<text x="293" y="796" font-size="11" fill="#222">BUY: %K crosses above %D</text>
<text x="293" y="809.5" font-size="11" fill="#222">SELL: %K crosses below %D</text>
<text x="293" y="823" font-size="11" fill="#222">(slides 185, 187)</text>
<rect x="545" y="778" width="130" height="64" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="610" y="807" text-anchor="middle" font-size="12">7. Vote 5: stochastic</text>
<text x="610" y="821" text-anchor="middle" font-size="12">%K crossing %D</text>
<rect x="875" y="68" width="130" height="64" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="940" y="97" text-anchor="middle" font-size="12">8. Add the five votes</text>
<text x="940" y="111" text-anchor="middle" font-size="12">for each day</text>
<polygon points="940,200 965,225 940,250 915,225" fill="#fff" stroke="#222" stroke-width="1.8"/>
<path d="M932,217 L948,233 M948,217 L932,233" stroke="#222" stroke-width="2.4"/>
<text x="930" y="278" text-anchor="end" font-size="11.5">Signal day?</text>
<text x="930" y="292" text-anchor="end" font-size="11.5">(a bar or oscillator</text>
<text x="930" y="306" text-anchor="end" font-size="11.5">fired, votes not cancel)</text>
<rect x="875" y="318" width="130" height="64" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="940" y="347" text-anchor="middle" font-size="12">9. Choose BUY or</text>
<text x="940" y="361" text-anchor="middle" font-size="12">SELL by net vote</text>
<polygon points="940,440 965,465 940,490 915,465" fill="#fff" stroke="#222" stroke-width="1.8"/>
<path d="M932,457 L948,473 M948,457 L932,473" stroke="#222" stroke-width="2.4"/>
<text x="940" y="506" text-anchor="middle" font-size="11.5">BUY or SELL?</text>
<path d="M753,349 L739,349 L739,411 L753,411" fill="none" stroke="#555" stroke-width="1.4"/>
<text x="747" y="364" font-size="11" fill="#222">BUY trigger: above</text>
<text x="747" y="377.5" font-size="11" fill="#222">the day&#x27;s high</text>
<text x="747" y="391" font-size="11" fill="#222">(slide 201)</text>
<path d="M1016,337 L1002,337 L1002,415 L1016,415" fill="none" stroke="#555" stroke-width="1.4"/>
<text x="1010" y="352" font-size="11" fill="#222">SELL trigger: below the</text>
<text x="1010" y="365.5" font-size="11" fill="#222">day&#x27;s low. The mirror of</text>
<text x="1010" y="379" font-size="11" fill="#222">slide 201, our choice</text>
<rect x="735" y="433" width="130" height="64" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="800" y="462" text-anchor="middle" font-size="12">10. BUY trigger:</text>
<text x="800" y="476" text-anchor="middle" font-size="12">above the high</text>
<rect x="1020" y="433" width="130" height="64" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="1085" y="462" text-anchor="middle" font-size="12">11. SELL trigger:</text>
<text x="1085" y="476" text-anchor="middle" font-size="12">below the low</text>
<rect x="875" y="608" width="130" height="64" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="940" y="630" text-anchor="middle" font-size="12">12. Record the</text>
<text x="940" y="644" text-anchor="middle" font-size="12">signal day: side,</text>
<text x="940" y="658" text-anchor="middle" font-size="12">trigger, agree</text>
<path d="M1034,600 L1020,600 L1020,680 L1034,680" fill="none" stroke="#555" stroke-width="1.4"/>
<text x="1028" y="615" font-size="11" fill="#222">agree = the votes</text>
<text x="1028" y="628.5" font-size="11" fill="#222">on the winning</text>
<text x="1028" y="642" font-size="11" fill="#222">side, of five</text>
<rect x="875" y="738" width="130" height="64" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="940" y="760" text-anchor="middle" font-size="12">13. Mark the volume:</text>
<text x="940" y="774" text-anchor="middle" font-size="12">CONFIRMED if above</text>
<text x="940" y="788" text-anchor="middle" font-size="12">the average</text>
<path d="M1034,730 L1020,730 L1020,810 L1034,810" fill="none" stroke="#555" stroke-width="1.4"/>
<text x="1028" y="745" font-size="11" fill="#222">Volume is not a vote.</text>
<text x="1028" y="758.5" font-size="11" fill="#222">Average of the whole</text>
<text x="1028" y="772" font-size="11" fill="#222">file (slide 128)</text>
<polygon points="940,865 965,890 940,915 915,890" fill="#fff" stroke="#222" stroke-width="1.8"/>
<path d="M932,882 L948,898 M948,882 L932,898" stroke="#222" stroke-width="2.4"/>
<text x="972" y="894" text-anchor="start" font-size="11.5"></text>
<rect x="1185" y="68" width="130" height="64" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="1250" y="90" text-anchor="middle" font-size="12">14. Draw the chart:</text>
<text x="1250" y="104" text-anchor="middle" font-size="12">price, volume, and</text>
<text x="1250" y="118" text-anchor="middle" font-size="12">three oscillators</text>
<path d="M1432,75 L1458,75 L1468,85 L1468,125 L1432,125 Z" fill="#fff" stroke="#222" stroke-width="1.5"/>
<path d="M1458,75 L1458,85 L1468,85" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="1450" y="140" text-anchor="middle" font-size="11.5" font-weight="bold">chart</text>
<text x="1450" y="154" text-anchor="middle" font-size="11.5" font-weight="bold">output/&lt;ticker&gt;.png</text>
<rect x="1185" y="218" width="130" height="64" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="1250" y="247" text-anchor="middle" font-size="12">15. Print a summary</text>
<text x="1250" y="261" text-anchor="middle" font-size="12">for this stock</text>
<path d="M1432,225 L1458,225 L1468,235 L1468,275 L1432,275 Z" fill="#fff" stroke="#222" stroke-width="1.5"/>
<path d="M1458,225 L1458,235 L1468,235" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="1450" y="290" text-anchor="middle" font-size="11.5" font-weight="bold">console summary</text>
<text x="1450" y="304" text-anchor="middle" font-size="11.5" font-weight="bold">(signal days, votes)</text>
<rect x="1185" y="368" width="130" height="64" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="1250" y="397" text-anchor="middle" font-size="12">16. Add its signals</text>
<text x="1250" y="411" text-anchor="middle" font-size="12">to the full list</text>
<polygon points="1250,505 1275,530 1250,555 1225,530" fill="#fff" stroke="#222" stroke-width="1.8"/>
<path d="M1242,522 L1258,538 M1258,522 L1242,538" stroke="#222" stroke-width="2.4"/>
<text x="1226" y="487" text-anchor="end" font-size="11.5">Another</text>
<text x="1226" y="501" text-anchor="end" font-size="11.5">file left?</text>
<rect x="1185" y="638" width="130" height="64" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="1250" y="667" text-anchor="middle" font-size="12">17. Write the</text>
<text x="1250" y="681" text-anchor="middle" font-size="12">signals table</text>
<path d="M1432,645 L1458,645 L1468,655 L1468,695 L1432,695 Z" fill="#fff" stroke="#222" stroke-width="1.5"/>
<path d="M1458,645 L1458,655 L1468,655" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="1450" y="710" text-anchor="middle" font-size="11.5" font-weight="bold">signals.csv</text>
<path d="M1354,750 L1340,750 L1340,850 L1354,850" fill="none" stroke="#555" stroke-width="1.4"/>
<text x="1348" y="765" font-size="11" fill="#222">ticker, date, side, entry,</text>
<text x="1348" y="778.5" font-size="11" fill="#222">trend, bar, rsi, macd, stoch,</text>
<text x="1348" y="792" font-size="11" fill="#222">agree (votes on the side),</text>
<text x="1348" y="805.5" font-size="11" fill="#222">volume (CONFIRMED or NOT)</text>
<circle cx="1240" cy="820" r="18" fill="#fff" stroke="#222" stroke-width="4.5"/>
<text x="1240" y="854" text-anchor="middle" font-size="11.5">Signals and</text>
<text x="1240" y="868" text-anchor="middle" font-size="11.5">charts ready</text>
</svg>