<circle cx="60" cy="150" r="18" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="60" y="184" text-anchor="middle" font-size="11.5">Run the script</text>
<rect x="135" y="115" width="130" height="70" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="200" y="147" text-anchor="middle" font-size="11.5">1. List the CSV files</text>
<text x="200" y="161" text-anchor="middle" font-size="11.5">in the data folder</text>
<polygon points="340,125 365,150 340,175 315,150" fill="#fff" stroke="#222" stroke-width="1.8"/>
<path d="M332,142 L348,158 M348,142 L332,158" stroke="#222" stroke-width="2.4"/>
<text x="316" y="107" text-anchor="end" font-size="11.5">Another</text>
<text x="316" y="121" text-anchor="end" font-size="11.5">file left?</text>
<rect x="425" y="115" width="130" height="70" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="490" y="147" text-anchor="middle" font-size="11.5">2. Read the file and</text>
<text x="490" y="161" text-anchor="middle" font-size="11.5">clean its dates</text>
<polygon points="490,305 515,330 490,355 465,330" fill="#fff" stroke="#222" stroke-width="1.8"/>
<path d="M482,322 L498,338 M498,322 L482,338" stroke="#222" stroke-width="2.4"/>
<text x="480" y="383" text-anchor="end" font-size="11.5">Another day left?</text>
<polygon points="660,305 685,330 660,355 635,330" fill="#fff" stroke="#222" stroke-width="1.8"/>
<path d="M652,322 L668,338 M668,322 L652,338" stroke="#222" stroke-width="2.4"/>
<text x="660" y="283" text-anchor="middle" font-size="11.5">Gap up, then back to</text>
<text x="660" y="297" text-anchor="middle" font-size="11.5">yesterday&#x27;s high?</text>
<polygon points="820,305 845,330 820,355 795,330" fill="#fff" stroke="#222" stroke-width="1.8"/>
<path d="M812,322 L828,338 M828,322 L812,338" stroke="#222" stroke-width="2.4"/>
<text x="820" y="283" text-anchor="middle" font-size="11.5">Gap down, then back to</text>
<text x="820" y="297" text-anchor="middle" font-size="11.5">yesterday&#x27;s low?</text>
<rect x="595" y="415" width="130" height="70" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="660" y="440" text-anchor="middle" font-size="11.5">3. Record a SELL signal</text>
<text x="660" y="454" text-anchor="middle" font-size="11.5">entry = yesterday&#x27;s high</text>
<text x="660" y="468" text-anchor="middle" font-size="11.5">stoploss = today&#x27;s high</text>
<rect x="755" y="415" width="130" height="70" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="820" y="440" text-anchor="middle" font-size="11.5">4. Record a BUY signal</text>
<text x="820" y="454" text-anchor="middle" font-size="11.5">entry = yesterday&#x27;s low</text>
<text x="820" y="468" text-anchor="middle" font-size="11.5">stoploss = today&#x27;s low</text>
<rect x="285" y="295" width="130" height="70" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="350" y="327" text-anchor="middle" font-size="11.5">5. Draw the chart</text>
<text x="350" y="341" text-anchor="middle" font-size="11.5">with the signals marked</text>
<rect x="135" y="295" width="130" height="70" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="200" y="327" text-anchor="middle" font-size="11.5">6. Print the answer</text>
<text x="200" y="341" text-anchor="middle" font-size="11.5">for this stock</text>
<rect x="-15" y="295" width="130" height="70" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="50" y="327" text-anchor="middle" font-size="11.5">7. Add its signals</text>
<text x="50" y="341" text-anchor="middle" font-size="11.5">to the full list</text>
<rect x="425" y="25" width="130" height="70" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="490" y="57" text-anchor="middle" font-size="11.5">8. Write</text>
<text x="490" y="71" text-anchor="middle" font-size="11.5">output/signals.csv</text>
<circle cx="640" cy="60" r="18" fill="#fff" stroke="#222" stroke-width="4.5"/>
<text x="640" y="94" text-anchor="middle" font-size="11.5">Signals, charts</text>
<text x="640" y="108" text-anchor="middle" font-size="11.5">and answers ready</text>
</svg>