<text x="28" y="650" font-size="11" fill="#222">Date (a date)</text>
<text x="28" y="663.5" font-size="11" fill="#222">Open, High, Low, Close (prices,</text>
<text x="28" y="677" font-size="11" fill="#222">numbers)</text>
<text x="28" y="690.5" font-size="11" fill="#222">Volume (a whole number)</text>
