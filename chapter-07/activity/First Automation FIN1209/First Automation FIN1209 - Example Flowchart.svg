<polyline points="1420,681 1420,708" fill="none" stroke="#555" stroke-width="1.2" stroke-dasharray="2 3"/>
<polyline points="1230,662 1230,712 1215,712 1215,732" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="1255,500 1300,500 1300,900 24,900 24,300 75,300" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="1269.5" y="493" font-size="12" font-weight="bold" fill="#8a1c1c">yes</text>
<circle cx="140" cy="80" r="18" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="166" y="84" text-anchor="start" font-size="11.5">Run the script</text>
<rect x="75" y="138" width="130" height="64" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="140" y="160" text-anchor="middle" font-size="12">1. List the CSV</text>
<text x="140" y="174" text-anchor="middle" font-size="12">files in the</text>
<text x="140" y="188" text-anchor="middle" font-size="12">data folder</text>
<rect x="75" y="268" width="130" height="64" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="140" y="297" text-anchor="middle" font-size="12">2. Read each file</text>
<text x="140" y="311" text-anchor="middle" font-size="12">and clean its dates</text>
<path d="M122,405 L148,405 L158,415 L158,455 L122,455 Z" fill="#fff" stroke="#222" stroke-width="1.5"/>
<path d="M148,405 L148,415 L158,415" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="164" y="434" text-anchor="start" font-size="11.5" font-weight="bold">data/&lt;ticker&gt;.csv</text>
<path d="M34,504 L20,504 L20,616 L34,616" fill="none" stroke="#555" stroke-width="1.4"/>
<text x="28" y="519" font-size="11" fill="#222">Input: one CSV file per stock,</text>
<text x="28" y="532.5" font-size="11" fill="#222">about a year of daily rows.</text>
<text x="28" y="546" font-size="11" fill="#222">Date (a date)</text>
<text x="28" y="559.5" font-size="11" fill="#222">Open, High, Low, Close (prices,</text>
<text x="28" y="573" font-size="11" fill="#222">numbers)</text>
<text x="28" y="586.5" font-size="11" fill="#222">Volume (a whole number)</text>
<path d="M299,104 L285,104 L285,216 L299,216" fill="none" stroke="#555" stroke-width="1.4"/>
<text x="293" y="119" font-size="11" fill="#222">RSI, 14 days (slide 195)</text>
<text x="293" y="132.5" font-size="11" fill="#222">Equilibrium line: 50</text>
<text x="293" y="146" font-size="11" fill="#222">BUY: crosses above 50</text>
<text x="293" y="159.5" font-size="11" fill="#222">SELL: crosses below 50</text>
<text x="293" y="173" font-size="11" fill="#222">(slide 74)</text>
<rect x="525" y="128" width="130" height="64" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="590" y="157" text-anchor="middle" font-size="12">3. Work out the RSI</text>
<text x="590" y="171" text-anchor="middle" font-size="12">and its crossings</text>
<path d="M299,277 L285,277 L285,403 L299,403" fill="none" stroke="#555" stroke-width="1.4"/>
<text x="293" y="292" font-size="11" fill="#222">MACD: 12 day EMA minus</text>
<text x="293" y="305.5" font-size="11" fill="#222">26 day EMA, signal line</text>
<text x="293" y="319" font-size="11" fill="#222">of 9 days (slides 166-168)</text>
<text x="293" y="332.5" font-size="11" fill="#222">BUY: MACD crosses above</text>
<text x="293" y="346" font-size="11" fill="#222">its signal line</text>
<text x="293" y="359.5" font-size="11" fill="#222">SELL: crosses below it</text>
<text x="293" y="373" font-size="11" fill="#222">(slide 83)</text>
<rect x="525" y="308" width="130" height="64" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="590" y="337" text-anchor="middle" font-size="12">4. Work out MACD</text>
<text x="590" y="351" text-anchor="middle" font-size="12">and its crossings</text>
<path d="M299,464 L285,464 L285,576 L299,576" fill="none" stroke="#555" stroke-width="1.4"/>
<text x="293" y="479" font-size="11" fill="#222">Stochastic: %K over 14 days,</text>
<text x="293" y="492.5" font-size="11" fill="#222">%D = 3 day average of %K</text>
<text x="293" y="506" font-size="11" fill="#222">(slides 185, 187)</text>
<text x="293" y="519.5" font-size="11" fill="#222">BUY: %K crosses above %D</text>
<text x="293" y="533" font-size="11" fill="#222">SELL: %K crosses below %D</text>
<rect x="525" y="488" width="130" height="64" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="590" y="510" text-anchor="middle" font-size="12">5. Work out the</text>
<text x="590" y="524" text-anchor="middle" font-size="12">stochastic and</text>
<text x="590" y="538" text-anchor="middle" font-size="12">its crossings</text>
<rect x="850" y="68" width="130" height="64" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="915" y="90" text-anchor="middle" font-size="12">6. Count how many</text>
<text x="915" y="104" text-anchor="middle" font-size="12">oscillators crossed</text>
<text x="915" y="118" text-anchor="middle" font-size="12">each day</text>
<polygon points="915,190 940,215 915,240 890,215" fill="#fff" stroke="#222" stroke-width="1.8"/>
<path d="M907,207 L923,223 M923,207 L907,223" stroke="#222" stroke-width="2.4"/>
<text x="905" y="268" text-anchor="end" font-size="11.5">How many of</text>
<text x="905" y="282" text-anchor="end" font-size="11.5">the 3 agree?</text>
<path d="M996,185 L982,185 L982,245 L996,245" fill="none" stroke="#555" stroke-width="1.4"/>
<text x="990" y="200" font-size="11" fill="#222">agree = oscillators that</text>
<text x="990" y="213.5" font-size="11" fill="#222">crossed the same way</text>
<rect x="850" y="298" width="130" height="64" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="915" y="327" text-anchor="middle" font-size="12">7. Choose BUY or</text>
<text x="915" y="341" text-anchor="middle" font-size="12">SELL by net vote</text>
<polygon points="915,415 940,440 915,465 890,440" fill="#fff" stroke="#222" stroke-width="1.8"/>
<path d="M907,432 L923,448 M923,432 L907,448" stroke="#222" stroke-width="2.4"/>
<text x="915" y="481" text-anchor="middle" font-size="11.5">BUY or SELL?</text>
<path d="M725,324 L711,324 L711,386 L725,386" fill="none" stroke="#555" stroke-width="1.4"/>
<text x="719" y="339" font-size="11" fill="#222">BUY price = the</text>
<text x="719" y="352.5" font-size="11" fill="#222">day&#x27;s high (Lim&#x27;s</text>
<text x="719" y="366" font-size="11" fill="#222">trigger, slide 201)</text>
<path d="M994,324 L980,324 L980,386 L994,386" fill="none" stroke="#555" stroke-width="1.4"/>
<text x="988" y="339" font-size="11" fill="#222">SELL price = the close:</text>
<text x="988" y="352.5" font-size="11" fill="#222">our choice, the slides</text>
<text x="988" y="366" font-size="11" fill="#222">give no sell trigger</text>
<rect x="705" y="408" width="130" height="64" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="770" y="437" text-anchor="middle" font-size="12">8. BUY price =</text>
<text x="770" y="451" text-anchor="middle" font-size="12">the day&#x27;s high</text>
<rect x="995" y="408" width="130" height="64" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="1060" y="437" text-anchor="middle" font-size="12">9. SELL price =</text>
<text x="1060" y="451" text-anchor="middle" font-size="12">the day&#x27;s close</text>
<rect x="850" y="588" width="130" height="64" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="915" y="610" text-anchor="middle" font-size="12">10. Record the</text>
<text x="915" y="624" text-anchor="middle" font-size="12">signal day: side,</text>
<text x="915" y="638" text-anchor="middle" font-size="12">price, agree</text>
<polygon points="915,705 940,730 915,755 890,730" fill="#fff" stroke="#222" stroke-width="1.8"/>
<path d="M907,722 L923,738 M923,722 L907,738" stroke="#222" stroke-width="2.4"/>
<text x="947" y="734" text-anchor="start" font-size="11.5"></text>
<rect x="1165" y="68" width="130" height="64" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="1230" y="90" text-anchor="middle" font-size="12">11. Draw the chart:</text>
<text x="1230" y="104" text-anchor="middle" font-size="12">price + 3</text>
<text x="1230" y="118" text-anchor="middle" font-size="12">oscillators</text>
<path d="M1402,75 L1428,75 L1438,85 L1438,125 L1402,125 Z" fill="#fff" stroke="#222" stroke-width="1.5"/>
<path d="M1428,75 L1428,85 L1438,85" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="1420" y="140" text-anchor="middle" font-size="11.5" font-weight="bold">chart</text>
<text x="1420" y="154" text-anchor="middle" font-size="11.5" font-weight="bold">output/&lt;ticker&gt;.png</text>
<rect x="1165" y="208" width="130" height="64" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="1230" y="237" text-anchor="middle" font-size="12">12. Print summary</text>
<text x="1230" y="251" text-anchor="middle" font-size="12">for this stock</text>
<path d="M1402,215 L1428,215 L1438,225 L1438,265 L1402,265 Z" fill="#fff" stroke="#222" stroke-width="1.5"/>
<path d="M1428,215 L1428,225 L1438,225" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="1420" y="280" text-anchor="middle" font-size="11.5" font-weight="bold">console summary</text>
<text x="1420" y="294" text-anchor="middle" font-size="11.5" font-weight="bold">(signal days, agree)</text>
<rect x="1165" y="348" width="130" height="64" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="1230" y="377" text-anchor="middle" font-size="12">13. Add signals to</text>
<text x="1230" y="391" text-anchor="middle" font-size="12">the full list</text>
<polygon points="1230,475 1255,500 1230,525 1205,500" fill="#fff" stroke="#222" stroke-width="1.8"/>
<path d="M1222,492 L1238,508 M1238,492 L1222,508" stroke="#222" stroke-width="2.4"/>
<text x="1206" y="457" text-anchor="end" font-size="11.5">Another</text>
<text x="1206" y="471" text-anchor="end" font-size="11.5">file left?</text>
<rect x="1165" y="598" width="130" height="64" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="1230" y="627" text-anchor="middle" font-size="12">14. Write the</text>
<text x="1230" y="641" text-anchor="middle" font-size="12">signals table</text>
<path d="M1402,605 L1428,605 L1438,615 L1438,655 L1402,655 Z" fill="#fff" stroke="#222" stroke-width="1.5"/>
<path d="M1428,605 L1428,615 L1438,615" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="1420" y="670" text-anchor="middle" font-size="11.5" font-weight="bold">signals.csv</text>
<path d="M1309,708 L1295,708 L1295,782 L1309,782" fill="none" stroke="#555" stroke-width="1.4"/>
<text x="1303" y="723" font-size="11" fill="#222">ticker, date, side, entry,</text>
<text x="1303" y="736.5" font-size="11" fill="#222">rsi, macd, stoch (BUY, SELL,</text>
<text x="1303" y="750" font-size="11" fill="#222">or empty), agree (how many agree)</text>
<circle cx="1215" cy="750" r="18" fill="#fff" stroke="#222" stroke-width="4.5"/>
<text x="1215" y="784" text-anchor="middle" font-size="11.5">Signals and</text>
<text x="1215" y="798" text-anchor="middle" font-size="11.5">charts ready</text>
</svg>