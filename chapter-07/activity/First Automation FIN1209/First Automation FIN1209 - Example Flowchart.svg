<rect x="575" y="115" width="130" height="70" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="640" y="147" text-anchor="middle" font-size="11.5">3. Read the file</text>
<text x="640" y="161" text-anchor="middle" font-size="11.5">into a table</text>
<rect x="725" y="115" width="130" height="70" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="790" y="147" text-anchor="middle" font-size="11.5">4. Start an empty</text>
<text x="790" y="161" text-anchor="middle" font-size="11.5">signals table</text>
<polygon points="790,335 815,360 790,385 765,360" fill="#fff" stroke="#222" stroke-width="1.8"/>
<path d="M782,352 L798,368 M798,352 L782,368" stroke="#222" stroke-width="2.4"/>
