<text x="140" y="160" text-anchor="middle" font-size="12">1. Read the settings:</text>
<text x="140" y="174" text-anchor="middle" font-size="12">mode, stock,</text>
<text x="140" y="188" text-anchor="middle" font-size="12">bought price, date</text>
