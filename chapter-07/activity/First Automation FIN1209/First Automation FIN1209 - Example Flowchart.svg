<polyline points="205,300 245,300 245,55 590,55 590,128" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="525,160 475,160" fill="none" stroke="#555" stroke-width="1.2" stroke-dasharray="2 3"/>
<polyline points="590,192 590,308" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="525,340 475,340" fill="none" stroke="#555" stroke-width="1.2" stroke-dasharray="2 3"/>
<polyline points="590,372 590,488" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="525,520 475,520" fill="none" stroke="#555" stroke-width="1.2" stroke-dasharray="2 3"/>
<polyline points="655,520 680,520 680,100 850,100" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="915,132 915,190" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="940,215 982,215" fill="none" stroke="#555" stroke-width="1.2" stroke-dasharray="2 3"/>
<polyline points="915,240 915,298" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="922" y="273" font-size="12" font-weight="bold" fill="#8a1c1c">1, 2 or 3</text>
<polyline points="915,362 915,415" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="890,440 835,440" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="854.5" y="433" font-size="12" font-weight="bold" fill="#8a1c1c">BUY</text>
<polyline points="940,440 995,440" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="959.5" y="433" font-size="12" font-weight="bold" fill="#8a1c1c">SELL</text>
<polyline points="770,408 770,386" fill="none" stroke="#555" stroke-width="1.2" stroke-dasharray="2 3"/>
<polyline points="1060,408 1060,386" fill="none" stroke="#555" stroke-width="1.2" stroke-dasharray="2 3"/>
<polyline points="770,472 770,540 915,540 915,588" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="1060,472 1060,540 915,540 915,588" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="890,215 702,215 702,730 890,730" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="788" y="208" font-size="12" font-weight="bold" fill="#8a1c1c">none: skip</text>
<polyline points="915,652 915,705" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="915,755 915,815 1140,815 1140,100 1165,100" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="1230,132 1230,208" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="1230,272 1230,348" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="1230,412 1230,475" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="1295,100 1402,100" fill="none" stroke="#222" stroke-width="1.3" stroke-dasharray="2 3" marker-end="url(#ar)"/>
<polyline points="1295,240 1402,240" fill="none" stroke="#222" stroke-width="1.3" stroke-dasharray="2 3" marker-end="url(#ar)"/>
<polyline points="1230,525 1230,598" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="1237" y="565.5" font-size="12" font-weight="bold" fill="#8a1c1c">no</text>
