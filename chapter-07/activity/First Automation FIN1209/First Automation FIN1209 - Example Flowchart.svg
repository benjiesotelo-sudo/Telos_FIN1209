<text x="60" y="184" text-anchor="middle" font-size="11.5">Run the script</text>
<rect x="125" y="115" width="130" height="70" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="190" y="147" text-anchor="middle" font-size="11.5">1. Name the data</text>
<text x="190" y="161" text-anchor="middle" font-size="11.5">and output folders</text>
<rect x="275" y="115" width="130" height="70" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="340" y="147" text-anchor="middle" font-size="11.5">2. List the CSV files</text>
<text x="340" y="161" text-anchor="middle" font-size="11.5">in the data folder</text>
<polygon points="490,125 515,150 490,175 465,150" fill="#fff" stroke="#222" stroke-width="1.8"/>
<path d="M482,142 L498,158 M498,142 L482,158" stroke="#222" stroke-width="2.4"/>
