<text x="293" y="782.5" font-size="11" fill="#222">%D = 3 day average</text>
<text x="293" y="796" font-size="11" fill="#222">BUY: %K crosses above %D</text>
<text x="293" y="809.5" font-size="11" fill="#222">SELL: %K crosses below %D</text>
<text x="293" y="823" font-size="11" fill="#222">(slides 185, 187)</text>
<rect x="545" y="778" width="130" height="64" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="610" y="807" text-anchor="middle" font-size="12">7. Vote 5: stochastic</text>
<text x="610" y="821" text-anchor="middle" font-size="12">%K crossing %D</text>
<rect x="805" y="68" width="130" height="64" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
